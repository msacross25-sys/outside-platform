name: CI

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: outside
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/outside
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/outside
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/outside_shadow
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      SMOKE_BASE_URL: http://127.0.0.1:3000
      AUTH_SECRET: ci-only-outsiide-auth-secret-not-for-production
      MFA_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      EMAIL_DELIVERY_MODE: test
      MEDIA_STORAGE_MODE: test
      ALLOW_TEST_MEDIA_STORAGE: "true"
      MEDIA_SIGNING_SECRET: ci-only-media-signing-secret-not-for-production
      READINESS_MODE: test
      LIVE_MEDIA_PROVIDER: livekit
      LIVEKIT_TEST_MODE: "true"
      LIVEKIT_URL: wss://livekit.example.test
      LIVEKIT_API_KEY: ci-livekit-key
      LIVEKIT_API_SECRET: ci-livekit-secret
      LIVE_RECORDING_MODE: livekit
      LIVE_RECORDING_TEST_MODE: "true"
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -c "CREATE DATABASE outside_shadow;"
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - name: Verify migration history matches schema
        run: |
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --exit-code
      - name: Verify restored database contract
        run: npm run db:restore-verify
      - run: npm run lint
      - run: npm run typecheck

      - name: Production environment preflight
        env:
          NEXT_PUBLIC_APP_URL: https://outside.example.test
          EMAIL_DELIVERY_MODE: resend
          RESEND_API_KEY: re_ci_fake_key
          EMAIL_FROM: OUTSiiDE CI <security@outside.example.test>
          MEDIA_STORAGE_MODE: s3
          MEDIA_SIGNING_SECRET: ci-only-media-signing-secret-long-enough-for-production-check
          MEDIA_S3_ENDPOINT: https://s3.example.test
          MEDIA_S3_REGION: auto
          MEDIA_S3_BUCKET: outside-ci
          MEDIA_S3_ACCESS_KEY_ID: ci-access-key
          MEDIA_S3_SECRET_ACCESS_KEY: ci-secret-key
          LIVE_MEDIA_PROVIDER: livekit
          LIVEKIT_URL: wss://livekit.example.test
          LIVEKIT_API_KEY: ci-livekit-key
          LIVEKIT_API_SECRET: ci-livekit-secret
          LIVE_RECORDING_MODE: livekit
          REDIS_URL: redis://127.0.0.1:6379
        run: npm run deploy:preflight

      - run: npm run build
      - name: Start production server
        run: |
          npm run start -- -H 127.0.0.1 -p 3000 > /tmp/outside-next.log 2>&1 &
          echo $! > /tmp/outside-next.pid
      - name: Wait for OUTSiiDE
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/outside-next.log
          exit 1
      - name: Runtime smoke test
        run: npm run smoke

      - name: Production monitor contract
        env:
          PRODUCTION_BASE_URL: http://127.0.0.1:3000
          ALLOW_INSECURE_PRODUCTION_SMOKE: "true"
        run: npm run monitor:production

      - name: Stop local production server
        run: |
          if [ -f /tmp/outside-next.pid ]; then
            kill "$(cat /tmp/outside-next.pid)" || true
          fi

      - name: Build production container
        run: docker build --build-arg OUTSIDE_RELEASE="$GITHUB_SHA" --tag outside-ci .

      - name: Start production container
        run: |
          docker run -d --rm --network host \
            --name outside-ci \
            -e DATABASE_URL="$DATABASE_URL" \
            -e DIRECT_URL="$DIRECT_URL" \
            -e NEXT_PUBLIC_APP_URL="$NEXT_PUBLIC_APP_URL" \
            -e AUTH_SECRET="$AUTH_SECRET" \
            -e MFA_ENCRYPTION_KEY="$MFA_ENCRYPTION_KEY" \
            -e EMAIL_DELIVERY_MODE="$EMAIL_DELIVERY_MODE" \
            -e MEDIA_STORAGE_MODE="$MEDIA_STORAGE_MODE" \
            -e ALLOW_TEST_MEDIA_STORAGE="$ALLOW_TEST_MEDIA_STORAGE" \
            -e MEDIA_SIGNING_SECRET="$MEDIA_SIGNING_SECRET" \
            -e READINESS_MODE="$READINESS_MODE" \
            -e LIVE_MEDIA_PROVIDER="$LIVE_MEDIA_PROVIDER" \
            -e LIVEKIT_TEST_MODE="$LIVEKIT_TEST_MODE" \
            -e LIVEKIT_URL="$LIVEKIT_URL" \
            -e LIVE_RECORDING_MODE="$LIVE_RECORDING_MODE" \
            -e LIVE_RECORDING_TEST_MODE="$LIVE_RECORDING_TEST_MODE" \
            -e REDIS_URL="$REDIS_URL" \
            outside-ci

      - name: Verify production container
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/api/ready >/dev/null; then
              health="$(curl -fsS http://127.0.0.1:3000/api/health)"
              echo "$health"
              echo "$health" | grep -F "$GITHUB_SHA"
              docker inspect --format='{{json .State.Health}}' outside-ci
              exit 0
            fi
            sleep 1
          done
          docker logs outside-ci
          exit 1

      - name: Verify production container monitoring contract
        env:
          PRODUCTION_BASE_URL: http://127.0.0.1:3000
          ALLOW_INSECURE_PRODUCTION_SMOKE: "true"
          EXPECTED_RELEASE: ${{ github.sha }}
        run: npm run monitor:production

      - name: Stop production container
        if: always()
        run: docker stop outside-ci || true

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/outside-next.log || true
