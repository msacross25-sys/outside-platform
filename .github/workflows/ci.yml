name: CI

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: outside
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/outside
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/outside
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/outside_shadow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -c "CREATE DATABASE outside_shadow;"
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - name: Verify migration history matches schema
        run: |
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --exit-code
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
