name: CI

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: outside
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/outside
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/outside
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/outside_shadow
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      SMOKE_BASE_URL: http://127.0.0.1:3000
      AUTH_SECRET: ci-only-outsiide-auth-secret-not-for-production
      MFA_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      EMAIL_DELIVERY_MODE: test
      MEDIA_STORAGE_MODE: test
      ALLOW_TEST_MEDIA_STORAGE: "true"
      MEDIA_SIGNING_SECRET: ci-only-media-signing-secret-not-for-production
      READINESS_MODE: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -c "CREATE DATABASE outside_shadow;"
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - name: Verify migration history matches schema
        run: |
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --exit-code
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Start production server
        run: |
          npm run start -- -H 127.0.0.1 -p 3000 > /tmp/outside-next.log 2>&1 &
          echo $! > /tmp/outside-next.pid
      - name: Wait for OUTSiiDE
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/outside-next.log
          exit 1
      - name: Runtime smoke test
        run: npm run smoke
      - name: Show server log on failure
        if: failure()
        run: cat /tmp/outside-next.log || true
