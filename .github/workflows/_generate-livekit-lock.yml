name: Generate LiveKit Lock

on:
  push:
    branches:
      - live/sfu-transport-20260930

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: live/sfu-transport-20260930
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Add exact LiveKit dependencies
        run: npm install --save-exact livekit-client@2.22.3 livekit-server-sdk@2.19.1
      - name: Commit lockfile update
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            exit 0
          fi
          git config user.name "outside-ci"
          git config user.email "outside-ci@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Add LiveKit SFU dependencies"
          git push origin HEAD:live/sfu-transport-20260930
