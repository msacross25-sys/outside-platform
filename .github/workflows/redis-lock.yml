name: Redis Dependency Refresh

on:
  push:
    branches: [scale/million-user-hardening-20261001]

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scale/million-user-hardening-20261001
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install exact Redis client
        run: npm install redis@latest --save-exact --ignore-scripts
      - name: Commit dependency files
        run: |
          if git diff --quiet package.json package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Add pinned Redis client"
          git push origin HEAD:scale/million-user-hardening-20261001
