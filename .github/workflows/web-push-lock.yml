name: Web Push Lockfile Refresh

on:
  push:
    branches: [notifications/web-push-v2-20261001]

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: notifications/web-push-v2-20261001
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refresh npm lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile
        run: |
          if git diff --quiet package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Refresh lockfile for Web Push"
          git push origin HEAD:notifications/web-push-v2-20261001
